<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dominó - Meu Jogo</title>
    
    <!-- ===== CORREÇÃO DO ZOOM NO SAFARI (iOS) ===== -->
    <script>
        // Corrige o bug de zoom do Safari (iOS) ao voltar para a página via bfcache
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) {
                var viewport = document.querySelector('meta[name="viewport"]');
                if (viewport) {
                    // força o Safari a reaplicar o viewport do zero
                    viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
                }
                window.scrollTo(0, 0);
            }
        });
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ===== CORREÇÃO DE ZOOM E TOQUE ===== */
        html {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background: radial-gradient(circle at center, #2a8a44 0%, #1D6130 50%, #0d2e15 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
            touch-action: manipulation;
        }

        /* --- Menu Superior --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        /* ===== NOVO LOGO COM INTERAÇÃO ===== */
        .logo-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(3, 21, 58, 0.55);
            border: 1px solid rgba(3, 21, 58, 0.35);
            transition: all 0.3s ease;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }

        .logo:hover {
            background: rgba(3, 21, 58, 0.75);
            border-color: rgba(3, 21, 58, 0.6);
            transform: scale(1.05);
        }

        .logo img {
            height: 44px;
            width: auto;
            display: block;
            opacity: 0.55;
            transition: opacity 0.3s ease;
        }

        .logo:hover img {
            opacity: 0.9;
        }

        /* ===== CARD FLUTUANTE ===== */
        .logo-card {
            position: absolute;
            left: calc(100% + 12px);
            top: 50%;
            transform: translateY(-50%);
            background: rgba(3, 21, 58, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(247, 212, 74, 0.25);
            border-radius: 12px;
            padding: 10px 18px 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateY(-50%) translateX(-8px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .logo-card.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(-50%) translateX(0);
        }

        .logo-card-content {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .logo-card-title {
            display: flex;
            align-items: center;
            gap: 0;
            white-space: nowrap;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0;
        }

        .logo-card-title .name-white,
        .logo-card-title .name-gold {
            margin: 0;
            padding: 0;
            letter-spacing: 0;
        }

        .logo-card-title .name-white {
            color: #ffffff;
        }

        .logo-card-title .name-gold {
            color: #f7d44a;
        }

        .logo-card-title .arrow {
            margin-left: 6px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            transition: transform 0.3s ease;
        }

        .logo-card-sub {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .logo-card:hover {
            border-color: rgba(247, 212, 74, 0.5);
            background: rgba(3, 21, 58, 0.96);
            transform: translateY(-50%) translateX(4px);
        }

        .logo-card:hover .arrow {
            transform: translateX(3px);
            color: rgba(255, 255, 255, 0.7);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            text-decoration: none;
            color: white;
        }

        .nav-icon:hover {
            background: rgba(247, 212, 74, 0.2);
            border-color: #f7d44a;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(247, 212, 74, 0.15);
        }

        .nav-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: fill 0.3s;
        }

        .nav-icon:hover svg {
            fill: #f7d44a;
        }

        /* --- ESTILOS DO BOTÃO DE ÁUDIO --- */
        .audio-button {
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0;
            outline: none;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
        }

        .audio-button.muted {
            opacity: 0.55;
        }

        .audio-button.muted svg {
            opacity: 0.65;
        }

        .audio-button.playing {
            background: rgba(247, 212, 74, 0.12);
            border-color: rgba(247, 212, 74, 0.35);
        }

        .audio-button.playing svg {
            fill: #f7d44a;
        }

        .nav-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #1D6130;
        }

        .nav-avatar:hover {
            border-color: #f7d44a;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(247, 212, 74, 0.2);
        }

        .nav-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* --- Área Principal --- */
        main {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
        }

        .center-buttons {
            position: absolute;
            bottom: 28%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 90%;
            max-width: 450px;
            pointer-events: none;
        }

        .center-buttons button {
            pointer-events: auto;
            flex: 1 1 auto;
            min-width: 140px;
            padding: 16px 28px;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-play {
            background: linear-gradient(145deg, #f7d44a, #f5b82e);
            color: #1a4a2a;
            border: 1px solid rgba(255, 215, 0, 0.5);
            text-shadow: 0 1px 2px rgba(255, 255, 200, 0.6);
        }

        .btn-play::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.25) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            transform: rotate(25deg);
            pointer-events: none;
        }

        .btn-play:hover {
            transform: scale(1.06) translateY(-3px);
            box-shadow: 0 14px 35px rgba(245, 200, 66, 0.6);
            background: linear-gradient(145deg, #fde066, #f7c531);
        }

        .btn-play:hover::after {
            opacity: 1;
        }

        .btn-play:active {
            transform: scale(0.96);
            box-shadow: 0 4px 15px rgba(245, 200, 66, 0.4);
        }

        .btn-how {
            background: rgba(20, 40, 25, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #f0f9f0;
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .btn-how:hover {
            background: rgba(40, 70, 45, 0.7);
            backdrop-filter: blur(14px);
            transform: scale(1.05) translateY(-2px);
            border-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.4), 0 0 20px rgba(100, 200, 120, 0.2);
        }

        .btn-how:active {
            transform: scale(0.96);
            background: rgba(20, 40, 25, 0.8);
        }

        .background-title {
            position: absolute;
            font-size: 15vw;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.92);
            letter-spacing: 5px;
            z-index: 1;
            text-transform: uppercase;
            user-select: none;
            text-shadow: 0px 5px 20px rgba(0, 0, 0, 0.5);
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        .character-container {
            position: absolute;
            z-index: 2;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 85vh;
        }

        .character-container img {
            height: 85vh;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 15px rgba(29, 97, 48, 0.6));
        }

        /* ===== MODAL DE PERSONALIZAÇÃO ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content {
            background: linear-gradient(145deg, #14401f, #0d2e15);
            border: 1px solid rgba(247, 212, 74, 0.3);
            border-radius: 20px;
            padding: 40px 35px;
            max-width: 480px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .modal-content::-webkit-scrollbar {
            width: 6px;
        }
        .modal-content::-webkit-scrollbar-track {
            background: #0d2e15;
            border-radius: 10px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: #f7d44a;
            border-radius: 10px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #f7d44a;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .avatar-preview {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .avatar-preview .nav-avatar {
            width: 80px;
            height: 80px;
            border-width: 3px;
            pointer-events: none;
        }

        .avatar-options-label {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .avatar-options {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 0 0 25px;
            flex-wrap: wrap;
        }

        .avatar-option {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .avatar-option:hover {
            border-color: rgba(247, 212, 74, 0.5);
            transform: scale(1.05);
        }

        .avatar-option.selected {
            border-color: #f7d44a;
            box-shadow: 0 0 20px rgba(247, 212, 74, 0.3);
        }

        .avatar-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-option .avatar-number {
            font-size: 14px;
            font-weight: 700;
            color: rgba(255,255,255,0.5);
            position: absolute;
            bottom: 4px;
            right: 6px;
            background: rgba(0,0,0,0.5);
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 10px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 10px;
        }

        .modal-buttons button {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-save {
            background: linear-gradient(145deg, #f7d44a, #f5b82e);
            color: #1a4a2a;
            flex: 1;
        }

        .btn-save:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(247, 212, 74, 0.3);
        }

        .btn-close-modal {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2) !important;
            flex: 0.5;
        }

        .btn-close-modal:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        .modal-hint {
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            margin-top: 15px;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           📱 RESPONSIVIDADE
           ============================================================ */

        @media (max-width: 1025px) {
            body {
                overflow: hidden;
                min-height: 100dvh;
                width: 100%;
            }

            header {
                padding: 18px 22px;
            }

            .logo {
                width: 38px;
                height: 38px;
            }

            .logo img {
                height: 35px;
            }

            .logo-card {
                padding: 8px 14px 8px 12px;
                left: calc(100% + 8px);
            }

            .logo-card-title {
                font-size: 0.8rem;
            }

            .logo-card-sub {
                font-size: 0.55rem;
            }

            .nav-icon {
                width: 32px;
                height: 32px;
            }

            .nav-icon svg {
                width: 17px;
                height: 17px;
            }

            .nav-avatar {
                width: 34px;
                height: 34px;
            }

            main {
                min-height: 100dvh;
                height: 100dvh;
                overflow: hidden;
            }

            .background-title {
                font-size: clamp(72px, 21vw, 150px);
                letter-spacing: 1px;
                top: 24%;
                transform: translate(-50%, -50%);
                white-space: nowrap;
            }

            .center-buttons {
                bottom: 22%;
                gap: 14px;
                width: 92%;
                max-width: 380px;
            }

            .center-buttons button {
                min-width: 120px;
                padding: 14px 20px;
                font-size: 0.95rem;
                border-radius: 50px;
                flex: 1 1 130px;
            }

            .character-container {
                z-index: 3;
                bottom: -5px;
                left: 50%;
                transform: translateX(-50%);
                width: 100%;
                height: 68dvh;
                display: flex;
                justify-content: center;
                align-items: flex-end;
            }

            .character-container img {
                width: auto;
                height: 68dvh;
                max-width: 100%;
                object-fit: contain;
                filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 12px rgba(29, 97, 48, 0.6));
            }

            .modal-content {
                padding: 30px 20px;
                max-width: 400px;
            }

            .avatar-preview .nav-avatar {
                width: 70px;
                height: 70px;
            }

            .avatar-option {
                width: 60px;
                height: 60px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 16px 18px;
            }

            .logo {
                width: 34px;
                height: 34px;
            }

            .logo img {
                height: 31px;
            }

            .logo-card {
                padding: 6px 12px 6px 10px;
                left: calc(100% + 6px);
                border-radius: 10px;
                min-width: 120px;
            }

            .logo-card-title {
                font-size: 0.7rem;
            }

            .logo-card-sub {
                font-size: 0.5rem;
            }

            .nav-icon {
                width: 28px;
                height: 28px;
            }

            .nav-icon svg {
                width: 15px;
                height: 15px;
            }

            .nav-avatar {
                width: 30px;
                height: 30px;
            }

            .background-title {
                font-size: 22vw;
                top: 24%;
                letter-spacing: 0;
            }

            .center-buttons {
                bottom: 18%;
                gap: 12px;
                width: 95%;
                max-width: 320px;
                flex-direction: row;
            }

            .center-buttons button {
                min-width: 100px;
                padding: 12px 16px;
                font-size: 0.85rem;
                border-radius: 40px;
                flex: 1 1 110px;
                letter-spacing: 0.8px;
            }

            .character-container {
                height: 65dvh;
                bottom: 0;
            }

            .character-container img {
                height: 65dvh;
                max-width: 115%;
            }

            .modal-content {
                padding: 25px 16px;
                max-width: 340px;
            }

            .modal-title {
                font-size: 1.2rem;
                margin-bottom: 18px;
            }

            .avatar-preview .nav-avatar {
                width: 60px;
                height: 60px;
            }

            .avatar-option {
                width: 50px;
                height: 50px;
            }

            .modal-buttons button {
                padding: 10px 18px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) and (max-height: 700px) {
            .background-title {
                top: 22%;
                font-size: 20vw;
            }

            .center-buttons {
                bottom: 64%;
                gap: 10px;
                max-width: 280px;
            }

            .center-buttons button {
                min-width: 90px;
                padding: 10px 12px;
                font-size: 0.75rem;
                border-radius: 40px;
                flex: 1 1 90px;
            }

            .character-container {
                height: 63dvh;
            }

            .character-container img {
                height: 63dvh;
            }

            .modal-content {
                padding: 20px 14px;
                max-width: 300px;
            }

            .avatar-preview .nav-avatar {
                width: 50px;
                height: 50px;
            }

            .avatar-option {
                width: 44px;
                height: 44px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .background-title {
                font-size: 18vw;
            }

            .character-container img {
                height: 75vh;
            }

            .center-buttons {
                bottom: 25%;
                max-width: 420px;
                gap: 18px;
            }

            .center-buttons button {
                padding: 15px 26px;
                font-size: 1rem;
                min-width: 140px;
            }
        }

        @media (min-width: 1400px) {
            .center-buttons {
                bottom: 32%;
                max-width: 520px;
                gap: 30px;
            }
            .center-buttons button {
                font-size: 1.2rem;
                padding: 18px 36px;
            }
        }
    </style>
</head>
<body>

    <!-- Áudio de fundo -->
    <audio id="backgroundMusic" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <!-- Menu Superior -->
    <header>
        <div class="logo-wrapper" id="logoWrapper">
            <div class="logo" id="logoButton">
                <img src="marcadaagua.png" alt="Marca d'água">
            </div>
            
            <div class="logo-card" id="logoCard">
                <div class="logo-card-content">
                    <div class="logo-card-title">
                        <span class="name-white">Pablo</span><span class="name-gold">G</span><span class="name-white">.Dev</span>
                        <span class="arrow">↗</span>
                    </div>
                    <span class="logo-card-sub">Desenvolvido por</span>
                </div>
            </div>
        </div>

        <nav id="mainNav">
            <button class="nav-icon audio-button" id="audioButton" aria-label="Ativar música" type="button">
                <svg id="audioIcon" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.99 7.86-7 8.77v-2.06c2.89-.86 5-3.54-5-6.71s2.11-5.85 5-6.71z"/>
                </svg>
            </button>

            <a href="#" class="nav-icon" aria-label="Configurações">
                <svg viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </a>

            <div class="nav-avatar" id="navAvatar" onclick="openModal()">
                <img src="avatar3.png" alt="Avatar" id="avatarImage">
            </div>
        </nav>
    </header>

    <!-- Área Principal -->
    <main>
        <h1 class="background-title">DOMINÓ</h1>

        <div class="center-buttons">
            <button class="btn-play" onclick="window.location.href='jogo.html'">Jogar</button>
            <button class="btn-how" onclick="window.location.href='como-jogar.html'">Como jogar</button>
        </div>

        <div class="character-container">
            <img src="image.webp" alt="Dominó">
        </div>

    </main>

    <!-- ===== MODAL DE PERSONALIZAÇÃO ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h2 class="modal-title">Escolha seu Avatar</h2>

            <div class="avatar-preview">
                <div class="nav-avatar" id="modalPreview">
                    <img src="avatar3.png" alt="Avatar" id="modalAvatarImage">
                </div>
            </div>

            <div class="avatar-options-label">Selecione um avatar</div>
            <div class="avatar-options" id="avatarOptions">
                <div class="avatar-option" data-avatar="1" onclick="selectAvatar(1, this)">
                    <img src="avatar1.png" alt="Avatar 1">
                    <span class="avatar-number">1</span>
                </div>
                <div class="avatar-option" data-avatar="2" onclick="selectAvatar(2, this)">
                    <img src="avatar2.png" alt="Avatar 2">
                    <span class="avatar-number">2</span>
                </div>
                <div class="avatar-option selected" data-avatar="3" onclick="selectAvatar(3, this)">
                    <img src="avatar3.png" alt="Avatar 3">
                    <span class="avatar-number">3</span>
                </div>
            </div>

            <div class="modal-buttons">
                <button class="btn-close-modal" onclick="closeModal()">Cancelar</button>
                <button class="btn-save" onclick="saveAvatar()">Salvar</button>
            </div>

            <p class="modal-hint">Clique no avatar para personalizar • Os arquivos devem estar na mesma pasta</p>
        </div>
    </div>

    <script>
        // ============================================================
        // CORREÇÃO ADICIONAL: Reset do viewport em orientação change
        // ============================================================
        window.addEventListener('orientationchange', function() {
            var viewport = document.querySelector('meta[name="viewport"]');
            if (viewport) {
                setTimeout(function() {
                    viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
                }, 100);
            }
        });

        // ============================================================
        // NOVO: LÓGICA DO LOGO + CARD FLUTUANTE
        // ============================================================
        (function() {
            const logoWrapper = document.getElementById('logoWrapper');
            const logoCard = document.getElementById('logoCard');
            const logoButton = document.getElementById('logoButton');
            const SITE_URL = 'https://pablogdev.com.br';

            let isCardOpen = false;
            let clickCount = 0;
            let clickTimer = null;
            let isMobile = window.innerWidth <= 1025;

            function checkMobile() {
                isMobile = window.innerWidth <= 1025 || 'ontouchstart' in window;
            }
            checkMobile();
            window.addEventListener('resize', checkMobile);

            function openCard() {
                logoCard.classList.add('active');
                isCardOpen = true;
            }

            function closeCard() {
                logoCard.classList.remove('active');
                isCardOpen = false;
                clickCount = 0;
                if (clickTimer) {
                    clearTimeout(clickTimer);
                    clickTimer = null;
                }
            }

            function openSite(e) {
                e.stopPropagation();
                window.open(SITE_URL, '_blank');
                closeCard();
            }

            function handleLogoClickDesktop(e) {
                e.stopPropagation();
                
                if (isCardOpen) {
                    openSite(e);
                } else {
                    openCard();
                    if (clickTimer) clearTimeout(clickTimer);
                    clickTimer = setTimeout(() => {
                        closeCard();
                    }, 4000);
                }
            }

            function handleLogoClickMobile(e) {
                e.stopPropagation();
                
                if (isCardOpen) {
                    openSite(e);
                } else {
                    openCard();
                    if (clickTimer) clearTimeout(clickTimer);
                    clickTimer = setTimeout(() => {
                        closeCard();
                    }, 4000);
                }
            }

            function handleCardClick(e) {
                e.stopPropagation();
                openSite(e);
            }

            function handleOutsideClick(e) {
                if (isCardOpen && !logoWrapper.contains(e.target)) {
                    closeCard();
                }
            }

            function handleMouseEnter() {
                if (!isMobile && !isCardOpen) {
                    openCard();
                    if (clickTimer) clearTimeout(clickTimer);
                    clickTimer = setTimeout(() => {
                        if (!isMobile) closeCard();
                    }, 4000);
                }
            }

            function handleMouseLeave() {
                if (!isMobile) {
                    setTimeout(() => {
                        if (!isMobile && isCardOpen) {
                            const rect = logoWrapper.getBoundingClientRect();
                            const mouseX = event.clientX;
                            const mouseY = event.clientY;
                            if (mouseX >= rect.left && mouseX <= rect.right && 
                                mouseY >= rect.top && mouseY <= rect.bottom) {
                                return;
                            }
                            closeCard();
                        }
                    }, 300);
                }
            }

            function setupEvents() {
                logoButton.removeEventListener('click', handleLogoClickDesktop);
                logoButton.removeEventListener('click', handleLogoClickMobile);
                logoButton.removeEventListener('mouseenter', handleMouseEnter);
                logoButton.removeEventListener('mouseleave', handleMouseLeave);
                logoCard.removeEventListener('click', handleCardClick);
                document.removeEventListener('click', handleOutsideClick);

                if (isMobile) {
                    logoButton.addEventListener('click', handleLogoClickMobile);
                } else {
                    logoButton.addEventListener('click', handleLogoClickDesktop);
                    logoButton.addEventListener('mouseenter', handleMouseEnter);
                    logoButton.addEventListener('mouseleave', handleMouseLeave);
                }

                logoCard.addEventListener('click', handleCardClick);
                document.addEventListener('click', handleOutsideClick);
            }

            let resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    checkMobile();
                    if (isCardOpen) closeCard();
                    setupEvents();
                }, 250);
            });

            setupEvents();

            logoCard.addEventListener('click', function(e) {
                e.stopPropagation();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isCardOpen) {
                    closeCard();
                }
            });

            console.log('🔄 Logo com card flutuante ativado!');
            console.log('📱 Mobile:', isMobile);
            console.log('🔗 Site:', SITE_URL);
        })();

        // ============================================================
        // 🎵 MÚSICA DE FUNDO
        // ============================================================

        const backgroundMusic = document.getElementById('backgroundMusic');
        const audioButton = document.getElementById('audioButton');
        const audioIcon = document.getElementById('audioIcon');

        backgroundMusic.volume = 0.15;

        let musicEnabled = localStorage.getItem('musicEnabled');

        if (musicEnabled === null) {
            musicEnabled = 'true';
        }

        function updateAudioButton() {
            if (!backgroundMusic.paused) {
                audioButton.classList.add('playing');
                audioButton.classList.remove('muted');
                audioButton.setAttribute('aria-label', 'Desativar música');
            } else {
                audioButton.classList.remove('playing');
                audioButton.classList.add('muted');
                audioButton.setAttribute('aria-label', 'Ativar música');
            }
        }

        function startMusic() {
            if (musicEnabled !== 'true') return;

            backgroundMusic.play()
                .then(() => {
                    updateAudioButton();
                })
                .catch(() => {});
        }

        function startMusicAfterInteraction() {
            if (musicEnabled === 'true' && backgroundMusic.paused) {
                startMusic();
            }

            document.removeEventListener('click', startMusicAfterInteraction);
            document.removeEventListener('touchstart', startMusicAfterInteraction);
        }

        document.addEventListener('click', startMusicAfterInteraction);
        document.addEventListener('touchstart', startMusicAfterInteraction);

        audioButton.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();

            if (backgroundMusic.paused) {
                musicEnabled = 'true';
                localStorage.setItem('musicEnabled', 'true');

                backgroundMusic.play()
                    .then(() => {
                        updateAudioButton();
                    })
                    .catch(error => {
                        console.log('Não foi possível iniciar a música:', error);
                    });

            } else {
                backgroundMusic.pause();

                musicEnabled = 'false';
                localStorage.setItem('musicEnabled', 'false');

                updateAudioButton();
            }
        });

        updateAudioButton();
        startMusic();

        // ============================================================
        // CONFIGURAÇÕES DO AVATAR
        // ============================================================
        let avatarConfig = {
            selected: 3
        };

        function loadAvatarConfig() {
            const saved = localStorage.getItem('avatarConfig');
            if (saved) {
                try {
                    const config = JSON.parse(saved);
                    avatarConfig = { ...avatarConfig, ...config };
                } catch (e) {}
            }
            applyAvatar();
            updateModalSelection();
        }

        function saveAvatarConfig() {
            localStorage.setItem('avatarConfig', JSON.stringify(avatarConfig));
        }

        function applyAvatar() {
            const avatar = document.getElementById('navAvatar');
            avatar.innerHTML = '';
            
            const newImg = document.createElement('img');
            newImg.id = 'avatarImage';
            newImg.src = 'avatar' + avatarConfig.selected + '.png';
            newImg.alt = 'Avatar';
            newImg.onerror = function() {
                this.src = 'avatar3.png';
                avatarConfig.selected = 3;
                saveAvatarConfig();
            };
            avatar.appendChild(newImg);
            
            updateModalPreview();
        }

        function updateModalPreview() {
            const preview = document.getElementById('modalPreview');
            preview.innerHTML = '';
            
            const newImg = document.createElement('img');
            newImg.id = 'modalAvatarImage';
            newImg.src = 'avatar' + avatarConfig.selected + '.png';
            newImg.alt = 'Avatar';
            newImg.onerror = function() {
                this.src = 'avatar3.png';
            };
            preview.appendChild(newImg);
        }

        function updateModalSelection() {
            document.querySelectorAll('.avatar-option').forEach(el => {
                el.classList.remove('selected');
                if (parseInt(el.dataset.avatar) === avatarConfig.selected) {
                    el.classList.add('selected');
                }
            });
        }

        function openModal() {
            const modal = document.getElementById('modalOverlay');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            updateModalSelection();
            updateModalPreview();
        }

        function closeModal() {
            const modal = document.getElementById('modalOverlay');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        function selectAvatar(number, element) {
            document.querySelectorAll('.avatar-option').forEach(el => {
                el.classList.remove('selected');
            });
            element.classList.add('selected');
            
            const preview = document.getElementById('modalPreview');
            preview.innerHTML = '';
            const img = document.createElement('img');
            img.id = 'modalAvatarImage';
            img.src = 'avatar' + number + '.png';
            img.alt = 'Avatar';
            img.onerror = function() {
                this.src = 'avatar3.png';
            };
            preview.appendChild(img);
        }

        function saveAvatar() {
            const selected = document.querySelector('.avatar-option.selected');
            if (selected) {
                avatarConfig.selected = parseInt(selected.dataset.avatar);
            }
            
            saveAvatarConfig();
            applyAvatar();
            closeModal();
        }

        loadAvatarConfig();
    </script>

</body>
</html>
